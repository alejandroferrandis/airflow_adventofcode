[project]
name = "airflow-adventofcode"
version = "0.1.0"
description = "Advent of Code solutions orchestrated by Airflow, gated by CI/CD."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true      # airflow / psycopg2 not installed in CI
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]                  # make the `adventofcode` package importable
testpaths = ["adventofcode"]
python_files = ["test_*.py"]
addopts = "-q"
